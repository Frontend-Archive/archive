# 마크다운을 손으로 고쳐 푸시했을 때 blog-sw 를 다시 배포시킨다.
#
# 사이트는 빌드할 때 이 레포를 한 번 읽고 정적 페이지로 굳는다. 다시 빌드하지
# 않으면 고친 내용이 화면에 나오지 않는다.
#
# add-article.yml 이 만든 커밋은 여기로 오지 않는다. 워크플로가 만든 커밋은
# 다른 워크플로를 깨우지 않기 때문이다. 그쪽은 스스로 재배포를 건다.
name: Notify blog

on:
  push:
    branches: [main]
    paths: ['archives/**']
  workflow_dispatch:

concurrency:
  group: notify-blog
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: blog-sw 재배포 요청
        env:
          TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "BLOG_DISPATCH_TOKEN 시크릿이 없습니다." >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Frontend-Archive/blog-sw/dispatches \
            -d "{\"event_type\":\"archive-updated\",\"client_payload\":{\"sha\":\"$SHA\"}}"

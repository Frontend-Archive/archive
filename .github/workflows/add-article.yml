# blog-sw 의 /submit 이 보낸 변경 요청을 마크다운에 적용한다.
#
# 사이트 쪽은 무엇을 바꿀지만 넘긴다. 이 레포의 포맷 규칙은 prettier 설정이
# 알고 있으므로 파일 수정은 여기서 한다.
name: Add article

on:
  repository_dispatch:
    types: [add-article]

# 두 요청이 겹치면 나중 것이 앞 것의 커밋을 지운 채 밀어 넣는다. 줄 세운다.
concurrency:
  group: add-article
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 마크다운에 반영
        id: apply
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          message=$(node tools/apply-dispatch.mjs | tail -n 1)
          echo "message=$message" >> "$GITHUB_OUTPUT"

      - name: 포맷 정리
        run: npx prettier --write "archives/*.md"

      - name: 커밋
        id: commit
        env:
          MESSAGE: ${{ steps.apply.outputs.message }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archives
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "$MESSAGE"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 워크플로가 만든 커밋은 다른 워크플로를 깨우지 않는다. 재배포는 직접 건다.
      - name: blog-sw 재배포 요청
        if: steps.commit.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "BLOG_DISPATCH_TOKEN 시크릿이 없습니다." >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Frontend-Archive/blog-sw/dispatches \
            -d "{\"event_type\":\"archive-updated\",\"client_payload\":{\"sha\":\"$(git rev-parse HEAD)\"}}"
